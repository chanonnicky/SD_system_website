name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secrets
        run: |
          cat > assets/js/config.js << 'EOF'
          window.APP_CONFIG = {
            GAS_URL:        '${{ secrets.GAS_URL }}',
            SPREADSHEET_ID: '${{ secrets.SPREADSHEET_ID }}',
            GOOGLE_API_KEY: '${{ secrets.GOOGLE_API_KEY }}',
            CLIENT_SECRET:  '${{ secrets.CLIENT_SECRET }}',
            REPAIR_SHEET:   'แจ้งซ่อม',
            BOOKING_SHEET:  'จองห้องประชุม',
            FIREBASE: {
              apiKey:            'AIzaSyASQuoat2a3LrbHY1r7_iycoIx-1bLgKxc',
              authDomain:        'sd-av-website.firebaseapp.com',
              projectId:         'sd-av-website',
              storageBucket:     'sd-av-website.firebasestorage.app',
              messagingSenderId: '134184397016',
              appId:             '1:134184397016:web:b302bf3862374352044fad',
            },
            FIREBASE_VAPID: 'BDfunSXR3MJ9f5KYGhudsAuDNpXxYDNmV3zSxc5p5PyQyck6KhzDimijcmg4Lz8yHc4PjJI9_nNlzqEoBybxv20',
          };
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
